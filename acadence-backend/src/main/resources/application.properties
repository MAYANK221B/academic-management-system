spring.application.name=acadence-backend
server.port=8080
spring.profiles.default=local
# Application

# PostgreSQL Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/acadence_db
spring.datasource.username=${DB_USERNAME:acadence_app}
spring.datasource.password=${DB_PASSWORD}

# Flyway uses the same datasource as Hibernate.
spring.flyway.default-schema=public

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# External PEM files: PKCS#8 private key and X.509 public key, RSA >= 2048 bits.
acadence.jwt.issuer=acadence
acadence.jwt.audience=acadence-api
acadence.jwt.access-token-expiration=15m
acadence.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH}
acadence.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH}
